      - name: Instalar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Compilar
        working-directory: proj
        run: gradle setupCIWorkspace build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LegitClient
          path: proj/build/libs/LegitClient-1.0.0.jar
